<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stashly - Shared Item</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: var(--text-main);
      word-break: break-word;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 1.5rem 0;
    }
    .url-link {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      word-break: break-all;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .tag {
      background: #334155;
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .date {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .loading, .error {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="loading">Loading shared item...</div>
  </main>
  <script>
    const SUPABASE_URL = "https://iodqhxejlviovoaivnke.supabase.co";
    const ANON_KEY = "sb_publishable_Y4JMsINnkWaE9JLIi9vqQw_q_ON8E36";
    const app = document.getElementById("app");
    const token = new URLSearchParams(location.search).get("t") || "";

    if (!token || token.length !== 48) {
      app.innerHTML = '<div class="error">This link is unavailable.</div>';
    } else {
      fetch(`${SUPABASE_URL}/rest/v1/rpc/get_shared_item`, {
        method: "POST",
        headers: {
          apikey: ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_token: token })
      })
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        app.textContent = "";
        if (!rows || !rows.length) {
          app.innerHTML = '<div class="error">This link is unavailable.</div>';
          return;
        }
        const it = rows[0];
        const h = document.createElement("h1");
        h.textContent = it.title || "Untitled";
        app.append(h);

        if (it.content) {
          const p = document.createElement("pre");
          p.textContent = it.content;
          app.append(p);
        }

        if (it.url && /^https?:\/\//i.test(it.url)) {
          const a = document.createElement("a");
          a.className = "url-link";
          a.href = it.url;
          a.textContent = "Open link: " + it.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          app.append(a);
        }

        if (it.tags && it.tags.length > 0) {
          const tagsDiv = document.createElement("div");
          tagsDiv.className = "tags";
          for (const t of it.tags) {
            const span = document.createElement("span");
            span.className = "tag";
            span.textContent = "#" + t;
            tagsDiv.append(span);
          }
          app.append(tagsDiv);
        }

        if (it.updated_at) {
          const dateDiv = document.createElement("div");
          dateDiv.className = "date";
          dateDiv.textContent = "Last updated: " + new Date(it.updated_at).toLocaleDateString();
          app.append(dateDiv);
        }
      })
      .catch(() => {
        app.innerHTML = '<div class="error">This link is unavailable.</div>';
      });
    }
  </script>
</body>
</html>
