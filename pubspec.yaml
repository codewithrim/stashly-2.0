name: stashly
description: A private, cross-device save-for-later app for notes, links, snippets and images.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  connectivity_plus: ^6.0.3
  supabase_flutter: ^2.6.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.3
  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
